name: CI

# Verify types, offline regressions and the published bundle on every push to
# main and every PR. test:bundle builds dist/ itself.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Offline regression tests
        run: npm test

      # The standalone binary runs on Bun, where the bundle has to work too.
      - name: Download standalone pi
        env:
          GH_TOKEN: ${{ github.token }}
          PI_STANDALONE_VERSION: 1.5.0
        run: |
          dir="${RUNNER_TEMP}/pi-standalone"
          gh release download "v${PI_STANDALONE_VERSION}" --repo earendil-works/pi \
            --dir "${dir}" --pattern pi-linux-x64.tar.gz --pattern SHA256SUMS
          (cd "${dir}" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "${dir}/pi-linux-x64.tar.gz" -C "${dir}"
          echo "PI_STANDALONE_BIN=${dir}/pi/pi" >> "${GITHUB_ENV}"

      - name: End-to-end bundle test (Node and Bun)
        run: npm run test:bundle
